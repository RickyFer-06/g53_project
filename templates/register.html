<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registar - Sistema de Trading</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="login-card" style="max-width: 500px;">
    <h2 class="text-center text-primary mb-4">Criar Conta</h2>

    <form action="{{ url_for('register') }}" method="POST">

      <div class="mb-3">
        <label class="form-label">Tipo de conta</label>
        <select class="form-select" name="role" id="roleSelect" required onchange="updateForm()">
          <option value="" disabled selected>-- Escolher --</option>
          <option value="client">Cliente</option>
          <option value="corp">Supervisor de Corporações</option>
          <option value="broker">Supervisor de Corretores</option>
          <option value="client_sup">Supervisor de Clientes</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <div id="clientFields" style="display:none;">
        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-control" name="name" placeholder="Ex: João Silva">
        </div>
        <div class="mb-3">
          <label class="form-label">Morada</label>
          <input type="text" class="form-control" name="address" placeholder="Ex: Rua das Flores, 10, Lisboa">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Nome de utilizador</label>
        <input type="text" class="form-control" name="username" required placeholder="Ex: joaosilva">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required placeholder="Mínimo 6 caracteres">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar password</label>
        <input type="password" class="form-control" name="confirm" required placeholder="Repetir password">
      </div>

      <div id="codeField" style="display:none;" class="mb-4">
        <label class="form-label" id="codeLabel">Código de acesso</label>
        <input type="password" class="form-control" name="access_code" id="accessCode" placeholder="Código de acesso">
        <div class="form-text" id="codeHint"></div>
      </div>

      {% if erro %}
      <div class="alert alert-danger text-center">{{ erro }}</div>
      {% endif %}

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">Criar Conta</button>
        <a href="{{ url_for('user_login') }}" class="btn btn-outline-secondary">Já tenho conta</a>
      </div>
    </form>
  </div>

  <script>
    function updateForm() {
      const role = document.getElementById('roleSelect').value;
      const clientFields = document.getElementById('clientFields');
      const codeField = document.getElementById('codeField');
      const codeLabel = document.getElementById('codeLabel');
      const codeHint = document.getElementById('codeHint');
      const accessCode = document.getElementById('accessCode');

      clientFields.style.display = (role === 'client') ? 'block' : 'none';

      if (role === 'admin') {
        codeField.style.display = 'block';
        codeLabel.textContent = 'Código de administrador';
        codeHint.textContent = 'Necessário para criar uma conta de administrador.';
        accessCode.required = true;
      } else if (['corp', 'broker', 'client_sup'].includes(role)) {
        codeField.style.display = 'block';
        codeLabel.textContent = 'Código de supervisão';
        codeHint.textContent = 'Necessário para criar uma conta de supervisor.';
        accessCode.required = true;
      } else {
        codeField.style.display = 'none';
        accessCode.required = false;
      }
    }
  </script>
</body>

</html>
