<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Selecionar {{ tipo }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <div class="login-card" style="max-width: 480px;">
    <h2 class="text-center text-primary mb-2">Selecionar {{ tipo }}</h2>
    <p class="text-center text-muted mb-4" style="font-size: 0.9em;">Escolhe qual o painel que pretendes abrir.</p>

    <form action="{{ url_for('select_entity_post') }}" method="POST">
      <input type="hidden" name="tipo" value="{{ tipo_key }}">
      <div class="mb-4">
        <label class="form-label">{{ tipo }}</label>
        <select name="entity_id" class="form-select" required>
          <option value="" disabled selected>-- Escolher --</option>
          {% for item in entidades %}
          <option value="{{ item.id }}">{{ item.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Abrir Painel</button>
      </div>
    </form>
  </div>
</body>
</html>
